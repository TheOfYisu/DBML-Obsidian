<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- Database cylinder background -->
  <defs>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#0F172A"/>
  <!-- Database cylinder -->
  <path d="M16 28C16 18 32 10 52 10s36 8 36 18v72c0 10-16 18-36 18S16 110 16 100V28Z" fill="url(#dbGrad)" fill-opacity="0.15"/>
  <ellipse cx="52" cy="28" rx="36" ry="14" stroke="#3B82F6" stroke-width="2"/>
  <path d="M16 28v72c0 7.7 16 14 36 14s36-6.3 36-14V28" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 56c0 7.7 16 14 36 14s36-6.3 36-14" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <!-- Connector lines -->
  <line x1="92" y1="80" x2="108" y2="68" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="86" x2="108" y2="98" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="86" cy="83" r="8" fill="url(#nodeGrad)" stroke="#6366F1" stroke-width="2"/>
  <circle cx="114" cy="62" r="8" fill="url(#nodeGrad)" stroke="#6366F1" stroke-width="2"/>
  <circle cx="114" cy="104" r="8" fill="url(#nodeGrad)" stroke="#6366F1" stroke-width="2"/>
  <!-- Node icons (PK / FK) -->
  <text x="83" y="86" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="sans-serif">F</text>
  <text x="111" y="65" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="sans-serif">P</text>
  <text x="111" y="107" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="sans-serif">P</text>
  <!-- DBML label -->
  <text x="64" y="124" text-anchor="middle" fill="#475569" font-size="10" font-weight="600" font-family="sans-serif">DBML</text>
</svg>
